<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaaS Smart Calendar & Tasks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FullCalendar CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <!-- Chart.js CDN para analíticas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <header class="bg-indigo-600 text-white p-4 shadow-md flex flex-wrap justify-between items-center gap-4">
    <div>
      <h1 class="text-xl font-bold tracking-wide">PaaS Smart Calendar</h1>
      <p class="text-xs text-indigo-200">Arquitectura desacoplada en Node.js + PostgreSQL</p>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <!-- Selector de franja horaria -->
      <div class="flex items-center gap-2 bg-indigo-700/60 px-3 py-1.5 rounded-lg border border-indigo-400/30 text-xs font-medium">
        <span>Horario Enfoque:</span>
        <input type="time" id="scheduleStart" value="09:00" class="bg-indigo-900 border border-indigo-400/40 rounded px-1.5 py-0.5 text-white focus:outline-none">
        <span>a</span>
        <input type="time" id="scheduleEnd" value="20:00" class="bg-indigo-900 border border-indigo-400/40 rounded px-1.5 py-0.5 text-white focus:outline-none">
      </div>

      <button onclick="openAnalyticsModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-1.5">
        📊 Analítica
      </button>

      <button onclick="autoSchedule()" class="bg-purple-600 hover:bg-purple-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition">
        ⚡ Time Blocking Automático
      </button>

      <button onclick="openModal()" class="bg-white text-indigo-600 hover:bg-indigo-50 text-sm font-semibold px-4 py-2 rounded-lg shadow transition">
        + Nueva Tarea
      </button>
    </div>
  </header>

  <main class="p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto">
    <!-- Tablero Kanban -->
    <section class="lg:col-span-1 bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col h-[750px]">
      <h2 class="text-lg font-bold mb-4 flex items-center justify-between text-gray-700">
        <span>Tablero Kanban</span>
        <span id="task-count" class="text-xs bg-gray-200 px-2 py-0.5 rounded-full">0</span>
      </h2>
      
      <div class="flex-1 overflow-y-auto space-y-4 pr-1">
        <!-- Columna TODO -->
        <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
          <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Por Hacer</h3>
          <div id="col-todo" class="space-y-2 min-h-[40px]"></div>
        </div>

        <!-- Columna IN_PROGRESS -->
        <div class="bg-indigo-50/50 p-3 rounded-lg border border-indigo-100">
          <h3 class="text-xs font-bold text-indigo-600 uppercase tracking-wider mb-2">En Progreso / Agendado</h3>
          <div id="col-progress" class="space-y-2 min-h-[40px]"></div>
        </div>

        <!-- Columna DONE -->
        <div class="bg-emerald-50/50 p-3 rounded-lg border border-emerald-100">
          <h3 class="text-xs font-bold text-emerald-600 uppercase tracking-wider mb-2">Completado</h3>
          <div id="col-done" class="space-y-2 min-h-[40px]"></div>
        </div>
      </div>

      <!-- Papelera interactiva -->
      <div id="calendar-trash" class="mt-4 p-4 border-2 border-dashed border-red-200 bg-red-50/50 rounded-xl flex items-center justify-center gap-3 text-red-500 font-semibold text-xs tracking-wider uppercase transition-all duration-200 hover:bg-red-100 hover:border-red-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        <span>Arrastra aquí un evento para borrar</span>
      </div>
    </section>

    <!-- Vista de Calendario -->
    <section class="lg:col-span-2 bg-white p-4 rounded-xl shadow-sm border border-gray-200 h-[750px] flex flex-col">
      <div id="calendar" class="flex-1"></div>
    </section>
  </main>

  <!-- Modal para Nueva Tarea con Notas y Categoría -->
  <div id="taskModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl relative z-50 border border-gray-100">
      <h3 class="text-lg font-bold mb-4 text-gray-800">Nueva Tarea</h3>
      
      <form id="taskForm" onsubmit="createTask(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Título</label>
          <input type="text" id="taskTitle" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Notas / Contexto (Punto 6)</label>
          <textarea id="taskDescription" rows="2" placeholder="Enlaces, temario o detalles..." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Categoría</label>
            <select id="taskCategory" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="Estudio">Estudio</option>
              <option value="Trabajo">Trabajo</option>
              <option value="Gimnasio">Gimnasio</option>
              <option value="Enfoque">Enfoque</option>
              <option value="General">General</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Prioridad (1-3)</label>
            <select id="taskPriority" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="1">Baja (1)</option>
              <option value="2">Media (2)</option>
              <option value="3">Alta (3)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Duración (min)</label>
            <input type="number" id="taskDuration" value="60" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Fecha Límite</label>
            <input type="datetime-local" id="taskDueDate" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg font-medium transition">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold shadow transition">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal de Analítica de Tiempo -->
  <div id="analyticsModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl relative z-50 border border-gray-100">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-gray-800">📊 Distribución de Tiempo</h3>
        <button onclick="closeAnalyticsModal()" class="text-gray-400 hover:text-gray-600 text-lg font-bold">✕</button>
      </div>
      <div class="h-64 flex items-center justify-center">
        <canvas id="analyticsChart"></canvas>
      </div>
      <p class="text-xs text-gray-500 text-center mt-4">Horas totales dedicadas por cada categoría registrada en la agenda.</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
